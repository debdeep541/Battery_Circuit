[env:custom_bms_stm32g071]
platform = ststm32
board = nucleo_g071rb
framework = stm32cube

; --- Upload and Debug Settings ---
upload_protocol = stlink
debug_tool = stlink

; --- Build Flags ---
build_flags = 
    -Wall
    -Wextra
    -I include              ; Crucial: Tells the compiler where to find main.h
    -D STM32G071xx          ; Explicitly defines the microcontroller family
    -O2                     ; Standard optimization for production

; --- Linker Script (Highly Recommended) ---
; If CubeMX generated a specific linker script in your folder, uncomment the line below:
; board_build.ldscript = STM32G071GBUX_FLASH.ld